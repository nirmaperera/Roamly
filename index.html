<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roamly | AI-Powered Trip Planning</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="./Assets/favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    nav {
      width: 100%;
      background: #ffffff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eaeaea;
      position: sticky;
      top: 0;
      overflow: hidden;
      z-index: 1;
    }

    .logo a {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #E27606;
      text-decoration: none;
        position: relative;
        overflow: hidden;
    }

    .menu {
      display: flex;
      gap: 40px;
    }

    .menu a {
    text-decoration: none;
    position: relative;
    overflow: hidden;
    color: black
    }

    .menu a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    background-color: #177D83;
    width: 0%;
    transition: width 0.3s ease;
    }

    .menu a:hover::after {
    width: 100%;
    animation: heartbeat116 1.5s ease-in-out 0.3s infinite;
    }

    @keyframes heartbeat116 {
    0%, 100% {
        width: 100%;
    }
    50% {
        width: 60%;
    }
    }

    .app-btn {
      padding: 10px 18px;
      background: #000;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .app-btn:hover {
      opacity: 0.8;
    }

    /* HERO / BANNER */
.hero {
  position: relative;
  width: 100%;
  height: 85vh;
  background-image: url('Assets/hero.jpg'); /* Replace with real image URL */
  background-size: cover;
  background-position: center;
  border-radius: 0 0 20px 20px;
  display: flex;
  align-items: center;
  padding: 0 6vw;
  color: white;
}

.hero-content {
  max-width: 600px;
}

.hero h1 {
  font-size: 68px;
  font-weight: 700;
  line-height: 1.05;
  margin-bottom: 20px;
}

.hero p {
  font-size: 20px;
  font-weight: 400;
  opacity: 0.9;
  margin-bottom: 35px;
}

.cta-btn {
  display: inline-block;
  padding: 15px 32px;
  border-radius: 30px;
  background: #fff;
  color: #177D83;
  font-size: 18px;
  font-weight: 600;
  text-decoration: none;
  transition: opacity 0.2s ease;
}

.cta-btn:hover {
  opacity: 0.8;
}

/* SCROLL BUTTON */
.scroll-btn {
  position: absolute;
  bottom: 28px;
  right: 32px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(10px);
  color: #000;
  padding: 14px 26px;
  border-radius: 24px;
  text-decoration: none;
  font-size: 16px;
  font-weight: 500;
  transition: background 0.2s ease;
}

.scroll-btn:hover {
  background: rgba(255,255,255,0.55);
}

/* RESPONSIVE */
@media(max-width: 850px) {
  .hero {
    text-align: center;
    justify-content: center;
    padding: 0 5vw;
  }

  .hero h1 {
    font-size: 44px;
  }

  .cta-btn {
    margin: 0 auto;
  }

  .scroll-btn {
    bottom: 18px;
    right: 50%;
    transform: translateX(50%);
    padding: 12px 22px;
  }
}


    /* Mobile responsive */
    @media(max-width: 850px) {
      .menu {
        display: none; /* hide desktop menu */
      }
      .app-btn {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><a href="./index.html">Roamly</a></div>

    <div class="menu">
      <a href="./About/aboutUs.html">About us</a>
      <a href="./Privacy Policy/privacy-policy.html">Privacy Policy</a>
      <a href="./Terms of Service/terms-of-service.html">Terms of Service</a>
      <a href="./Support/support.html">Help Center </a>
    </div>

    <a class="app-btn" href="https://apps.apple.com" target="_blank">Download on App Store</a>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>Plan Smart. Roam Freely</h1>
      <p>Redefining travel planning with AI — faster, smarter, and fully in your control.</p>
      <a href="#" class="cta-btn">Let's roam!</a>
    </div>
  
    <a href="#next" class="scroll-btn">↓ Scroll down</a>
  </section>

  <footer style="text-align:center; font-size:12px; opacity:0.7; margin-top:40px;">
    Banner image: <a href="https://www.pexels.com/photo/festvagtind-henningsvaer-randonnee-voyage-tourisme-lofoten-19139418/" target="_blank" rel="noopener noreferrer">
      Photo by Clément Proust on Pexels
    </a>
  </footer>
</body>
</html>
