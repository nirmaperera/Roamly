<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About us</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    nav {
      width: 100%;
      background: #ffffff;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eaeaea;
      position: sticky;
      top: 0;
      overflow: hidden;
    }

    .logo a {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #E27606;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .menu {
      display: flex;
      gap: 40px;
    }

    .menu a {
      text-decoration: none;
      position: relative;
      overflow: hidden;
      color: black;
    }

    .menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      background-color: #177D83;
      width: 0%;
      transition: width 0.3s ease;
    }

    .menu a:hover::after {
      width: 100%;
      animation: heartbeat116 1.5s ease-in-out 0.3s infinite;
    }

    @keyframes heartbeat116 {
      0%, 100% {
        width: 100%;
      }
      50% {
        width: 60%;
      }
    }

    /* Active nav item */
    .menu a.active {
      font-weight: 500; /* bold */
      color: #177D83;
    }
    .menu a.active::after {
      width: 100%; /* underline stays visible */
    }

    .app-btn {
      padding: 10px 18px;
      background: #000;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .app-btn:hover {
      opacity: 0.8;
    }

    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #222;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
      background: white;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      margin-bottom: 18px;
    }

    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-top: 35px;
      margin-bottom: 10px;
    }

    ul {
      margin-bottom: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    footer {
      text-align: center;
      font-size: 13px;
      padding: 20px;
      opacity: 0.6;
      margin-top: 50px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 15px;
      }
      h1 {
        font-size: 26px;
      }
    }

    /* Mobile responsive */
    @media(max-width: 850px) {
      .menu {
        display: none;
      }
      .app-btn {
        margin-left: auto;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo"><a href="./index.html">Roamly</a></div>

    <div class="menu">
      <a href="./aboutUs.html">About us</a>
      <a href="./privacy-policy.html">Privacy Policy</a>
      <a href="./terms-of-service.html">Terms of Service</a>
      <a href="./support.html">Help Center</a>
    </div>

    <a class="app-btn" href="https://apps.apple.com" target="_blank">Download on App Store</a>
  </nav>

  <div class="container">
    <h1>About us</h1>

    </div>



  <!-- JS for automatic active nav highlighting -->
  <script>
    const currentPage = window.location.pathname.split("/").pop();
    const navLinks = document.querySelectorAll(".menu a");

    navLinks.forEach(link => {
      const linkPage = link.getAttribute("href").split("/").pop();
      if(linkPage === currentPage) {
        link.classList.add("active");
      }
    });
  </script>

</body>
</html>
